[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "0.1.0"
description = "A workspace-scoped AI engineering agent"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai==2.17.0",
    "python-dotenv==1.2.2",
]

[project.scripts]
devflow = "devflow.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["devflow*"]
